<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화담숲 감시 · 맥</title>
<!-- listener.py 가 http://127.0.0.1:8789/ 로 보여 주는 맥 수신기 상태·로그 화면 -->
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --text: #1d2228; --muted: #6b7480;
    --on: #0f8a4b; --on-bg: #e3f6ec; --off: #6b7480; --off-bg: #eceef1;
    --alert: #b45309; --alert-bg: #fff4e0; --ext: #1d5fbf; --err: #c0262d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --card: #1c2026; --line: #2c323a; --text: #e6e9ed; --muted: #8b949e;
      --on: #3fcf7f; --on-bg: #133224; --off: #8b949e; --off-bg: #262b32;
      --alert: #f5a524; --alert-bg: #3a2a0c; --ext: #6ea8ff; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pill { font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--off-bg); color: var(--off); }
  .pill.on { background: var(--on-bg); color: var(--on); }
  button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  a { color: var(--ext); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .logs-head { justify-content: space-between; margin-bottom: 8px; }
  .logs-head label { color: var(--muted); user-select: none; }
  .logs { overflow-x: auto; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .logs div { display: flex; gap: 12px; white-space: pre; padding: 1px 4px; border-radius: 4px; }
  .logs time { color: var(--muted); flex: none; width: 9.5em; }
  .logs .alert { background: var(--alert-bg); color: var(--alert); font-weight: 600; }
  .logs .ext { color: var(--ext); }
  .logs .err { color: var(--err); }
  .logs .conn { color: var(--muted); }
  .hide-conn .conn { display: none; }
  .settings { display: grid; gap: 10px; margin: 0; }
  .settings .field { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .settings .name { width: 7.5em; color: var(--muted); }
  input[type="date"], input[type="time"], input[type="number"] {
    font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  input[type="number"] { width: 4.5em; }
  .date { display: inline-flex; gap: 4px; align-items: center; }
  .date button, #addDate { padding: 2px 8px; font-weight: 400; }
  .ok { color: var(--on); }
  .bad { color: var(--err); }
  .only-key div:not(.alert):not(.ext):not(.err) { display: none; }
</style>
</head>
<body>
<main>
  <h1>화담숲 감시 · 맥</h1>

  <section class="card">
    <div class="row">
      <span>맥 20초 조회</span>
      <span id="pill" class="pill">…</span>
      <button id="toggle" type="button">…</button>
      <span class="spacer"></span>
      <a id="gh" target="_blank" rel="noopener">GitHub 오늘 조회 기록 ↗</a>
      <a href="https://leisure-web.yanolja.com/leisure/10367229" target="_blank" rel="noopener">상품 페이지 ↗</a>
    </div>
    <p id="last" class="muted" style="margin:10px 0 0"></p>
  </section>

  <section class="card" id="settings">
    <div class="row logs-head">
      <strong>노리는 것</strong>
      <span id="setSync" class="muted"></span>
    </div>
    <p id="setDescribe" style="margin:0 0 12px"></p>
    <form id="setForm" class="settings">
      <div class="field"><span class="name">날짜</span><span id="dates" class="row" style="gap:8px"></span>
        <button type="button" id="addDate">+ 날짜</button></div>
      <div class="field"><span class="name">입장 시각</span>
        <input type="time" id="EARLIEST_TIME" required> 이상 <input type="time" id="LATEST_TIME" required> 전</div>
      <div class="field"><span class="name">최소 남은 표</span>
        <input type="number" id="MIN_QUANTITY" min="1" max="10" required> 장 이상 남으면 알림·자동 예약</div>
      <div class="field"><span class="name">살 매수</span>
        <input type="number" id="QUANTITY" min="1" max="10" required> 장까지 (모자라면 남은 만큼)</div>
      <div class="row">
        <button type="submit" id="save">저장</button>
        <span id="setMsg"></span>
        <span class="spacer"></span>
        <a id="ghVars" target="_blank" rel="noopener">GitHub 변수 ↗</a>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="row logs-head">
      <strong>수신기 로그 <span class="muted" style="font-weight:400">(최근 1000줄, 새것이 위 · 맥 조회는 상태가 바뀔 때만 남음)</span></strong>
      <div class="row">
        <label><input type="checkbox" id="onlyKey"> 알림·확장·오류만</label>
        <label><input type="checkbox" id="hideConn" checked> 연결 로그 숨기기</label>
      </div>
    </div>
    <div id="logs" class="logs hide-conn"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const today = new Date();
  const ymd = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  $("gh").href = `https://github.com/kimhyeongjun95/hwadam-ticket-watch/blob/logs/${ymd}.csv`;

  // 연결 끊김은 맥이 잠들거나 망이 바뀔 때마다 쌓이는 잡음이라 오류보다 먼저 걸러 둔다
  const kind = (msg) =>
    /^연결/.test(msg) ? "conn"
    : /예약 가능|주문서|구매하기 누름/.test(msg) ? "alert"
    : /실패|못 |안 돼|않|쉼|마감|품절됐/.test(msg) ? "err"
    : /^확장:/.test(msg) ? "ext" : "";

  // last_poll 은 "13:45:43 10/31(토) 품절, …" 처럼 시각으로 시작한다. 20초마다 도는지 바로 보이게 몇 초 전인지 붙인다
  function ago(lastPoll) {
    const m = lastPoll.match(/^(\d\d):(\d\d):(\d\d)/);
    if (!m) return "";
    const t = new Date();
    t.setHours(+m[1], +m[2], +m[3], 0);
    const sec = Math.round((Date.now() - t) / 1000);
    return sec >= 0 && sec < 3600 ? ` (${sec}초 전)` : "";
  }

  function render(lines) {
    const box = $("logs");
    box.replaceChildren(...lines.slice().reverse().map((line) => {
      const m = line.match(/^(\d\d\/\d\d \d\d:\d\d:\d\d) (.*)$/);
      const row = document.createElement("div");
      const t = document.createElement("time");
      const span = document.createElement("span");
      t.textContent = m ? m[1] : "";
      span.textContent = m ? m[2] : line;
      row.className = kind(span.textContent);
      row.append(t, span);
      return row;
    }));
  }

  async function refresh() {
    try {
      const s = await (await fetch("/api/state", { cache: "no-store" })).json();
      $("pill").textContent = s.status;
      $("pill").className = "pill" + (s.on ? " on" : "");
      $("toggle").textContent = s.on ? "끄기" : "켜기";
      $("last").textContent = s.on ? (s.last_poll ? `마지막 조회 ${s.last_poll}${ago(s.last_poll)}` : "곧 첫 조회") : "꺼져 있으면 GitHub 1분 조회만 돈다";
      render(s.lines);
    } catch (e) {
      $("pill").textContent = "수신기 연결 안 됨";
      $("pill").className = "pill";
    }
  }

  // 노리는 것: GitHub 저장소 변수에 저장돼 GitHub 조회·맥 조회가 같이 쓴다
  const FIELDS = ["EARLIEST_TIME", "LATEST_TIME", "MIN_QUANTITY", "QUANTITY"];
  let dirty = false;  // 고치는 중에는 1분마다 다시 읽어도 칸을 덮어쓰지 않는다

  function dateRow(value) {
    const wrap = document.createElement("span");
    wrap.className = "date";
    const input = Object.assign(document.createElement("input"), { type: "date", value, required: true });
    const del = Object.assign(document.createElement("button"), { type: "button", textContent: "✕", title: "이 날짜 빼기" });
    del.onclick = () => { wrap.remove(); dirty = true; };
    wrap.append(input, del);
    return wrap;
  }

  function showSettings(s, force) {
    $("setDescribe").textContent = s.describe;
    $("ghVars").href = s.github_url;
    $("setSync").textContent = s.error || (s.synced_at ? `GitHub 와 맞춤 ${s.synced_at}` : "GitHub 와 맞추는 중…");
    $("setSync").className = s.error ? "bad" : "muted";
    if (dirty && !force) return;
    $("dates").replaceChildren(...s.values.TARGET_DATES.split(",").map(dateRow));
    for (const k of FIELDS) $(k).value = s.values[k];
    dirty = false;
  }

  async function loadSettings(force) {
    try { showSettings(await (await fetch("/api/settings", { cache: "no-store" })).json(), force); } catch (e) {}
  }

  $("setForm").oninput = () => { dirty = true; };
  $("addDate").onclick = () => { $("dates").append(dateRow("")); dirty = true; };
  $("setForm").onsubmit = async (e) => {
    e.preventDefault();
    const dates = [...$("dates").querySelectorAll("input")].map((i) => i.value).filter(Boolean);
    if (!dates.length) { $("setMsg").textContent = "날짜를 하나 이상 넣어 주세요"; $("setMsg").className = "bad"; return; }
    const body = { TARGET_DATES: dates.join(",") };
    for (const k of FIELDS) body[k] = $(k).value;
    $("save").disabled = true;
    $("setMsg").textContent = "GitHub 변수에 저장하는 중…";
    $("setMsg").className = "muted";
    try {
      const r = await (await fetch("/api/settings", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
      if (r.ok) {
        showSettings(r, true);
        $("setMsg").textContent = "저장했어요. 맥 조회는 바로, GitHub 조회는 다음 실행(1분 안)부터 적용돼요";
        $("setMsg").className = "ok";
      } else {
        if (r.describe) showSettings(r, false);
        $("setMsg").textContent = r.errors.join(" · ");
        $("setMsg").className = "bad";
      }
    } catch (err) {
      $("setMsg").textContent = "수신기에 연결이 안 돼요";
      $("setMsg").className = "bad";
    }
    $("save").disabled = false;
  };
  loadSettings(true);
  setInterval(loadSettings, 60000);

  $("toggle").onclick = async () => { await fetch("/poll/toggle", { cache: "no-store" }); refresh(); };
  $("onlyKey").onchange = (e) => $("logs").classList.toggle("only-key", e.target.checked);
  $("hideConn").onchange = (e) => $("logs").classList.toggle("hide-conn", e.target.checked);
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
