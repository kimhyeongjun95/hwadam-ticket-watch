name: watch

on:
  schedule:
    # 크론은 UTC 기준. 한국은 UTC+9 (서머타임 없음).
    # KST 07:00~23:55 에 돌고, 07:30 전 실행은 watch.py 가 조회 없이 끝낸다.
    - cron: '*/5 0-14,22-23 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: '조회 없이 테스트 알림만 보내기'
        type: boolean
        default: false
      force:
        description: '조용한 시간대(00:00~07:30)에도 조회하기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch

jobs:
  check:
    # ubuntu-latest 는 10/19 부터 Ubuntu 26 으로 바뀐다. 감시 기간 중 바뀌지 않게 고정.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      # 실행 기록은 main 을 어지럽히지 않게 logs 브랜치에 쌓는다
      - uses: actions/checkout@v5
        with:
          ref: logs
          path: logs

      - run: python3 watch.py
        env:
          # 외부에서 실행시켜도 밤에는 쉬도록, 수동 실행에서 체크했을 때만 조용한 시간대를 무시
          FORCE: ${{ inputs.force && '1' || '' }}
          NOTIFY_TEST: ${{ inputs.test_notify && '1' || '' }}
          LOG_DIR: logs
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 상태·기록 저장
        run: |
          save() {  # $1 = 저장소 폴더, $2 = 브랜치
            git -C "$1" add -A
            git -C "$1" diff --cached --quiet && return 0
            git -C "$1" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "$(TZ=Asia/Seoul date '+%m/%d %H:%M') KST"
            git -C "$1" pull -q --rebase origin "$2" && git -C "$1" push -q origin "HEAD:$2"
          }
          save logs logs
          save . main
